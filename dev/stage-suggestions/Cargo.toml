# Suggested stages for real codec operations, grouped by crate. Its own
# workspace, like dev/how-far-checkpoint-cost; it builds the codecs from the
# local zen checkouts, as imazen/enough's dev/cancel-latency does.
[workspace]

[package]
name = "stage-suggestions"
version = "0.0.0"
edition = "2024"
publish = false

[features]
default = [
    "zenflate",
    "zenpng",
    "zenjpeg",
    "zenwebp",
    "zengif",
    "zenbitmaps",
    "butteraugli",
    "fast-ssim2",
    "zenzop",
]
zenflate = ["dep:zenflate"]
zenpng = ["dep:zenpng"]
zenjpeg = ["dep:zenjpeg"]
zenwebp = ["dep:zenwebp"]
zengif = ["dep:zengif"]
zenbitmaps = ["dep:zenbitmaps"]
butteraugli = ["dep:butteraugli"]
fast-ssim2 = ["dep:fast-ssim2"]
zenzop = ["dep:zenzop"]

[dependencies]
how-far = { path = "../../crates/how-far" }
how-far-really = { path = "../../crates/how-far-really", features = ["stage-suggestions"] }
enough = "0.4.5"
almost-enough = "0.4.5"
imgref = "1.11"
rgb = "0.8"

zenflate = { path = "/home/lilith/work/zen/zenflate", optional = true }
zenpng = { path = "/home/lilith/work/zen/zenpng", optional = true }
zenjpeg = { path = "/home/lilith/work/zen/zenjpeg/zenjpeg", optional = true }
zenwebp = { path = "/home/lilith/work/zen/zenwebp", optional = true }
zengif = { path = "/home/lilith/work/zen/zengif", optional = true }
zenbitmaps = { path = "/home/lilith/work/zen/zenbitmaps", optional = true }
butteraugli = { path = "/home/lilith/work/butteraugli/butteraugli", optional = true }
fast-ssim2 = { path = "/home/lilith/work/zen/fast-ssim2/fast-ssim2", optional = true }
zenzop = { path = "/home/lilith/work/zen/zenzop", optional = true }

[profile.release]
debug = 1

# Patches the codecs need but cannot supply to dependents, mirrored from
# imazen/enough's dev/cancel-latency.
[patch.crates-io]
# zenquant's `*_with_stop` entry points are unreleased (crates.io has 0.1.3).
zenquant = { path = "/home/lilith/work/zen/zenquant" }
# zenanalyze-api/zenanalyze additions live on main, unpublished.
zenanalyze = { git = "https://github.com/imazen/zenanalyze" }
# butteraugli 0.9.4 is unreleased (crates.io has 0.9.3).
butteraugli = { path = "/home/lilith/work/butteraugli/butteraugli" }
# zenpng's own pins: coordinated animation timing types (unreleased).
zencodec = { git = "https://github.com/imazen/zencodec", rev = "2031094449ad1177ff96461d7c4d586c7ed384e6" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "789d69dbc314e748676b7f2f19542c17473ba40b" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "789d69dbc314e748676b7f2f19542c17473ba40b" }
